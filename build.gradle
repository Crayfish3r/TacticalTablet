plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def gameRunDirectory = providers.gradleProperty('gameRunDirectory').orElse('run-utopia')

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file(gameRunDirectory.get())
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def modMetadata = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
]

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    inputs.properties(modMetadata)
    filesMatching('META-INF/mods.toml') { expand(modMetadata) }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from('LICENSE.txt', 'CREDITS.txt')
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': project.version,
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('verifyTabletModelSource') {
    def source = layout.projectDirectory.file('model-sources/tablet/TacticalTablet_TT01.bbmodel')
    def generated = layout.projectDirectory.file('src/main/resources/assets/utopia/tablet/tt01.json')
    inputs.files(source, generated)
    doLast {
        def model = new groovy.json.JsonSlurper().parse(generated.asFile, 'UTF-8')
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(source.asFile.bytes).encodeHex().toString()
        if (model.sourceSha256 != hash) {
            throw new GradleException('TT01 source changed: run node tools/tablet/prepare-tablet.mjs')
        }
    }
}

tasks.named('check') { dependsOn 'verifyTabletModelSource' }
