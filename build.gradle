plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

def gameRunDirectory = providers.gradleProperty('gameRunDirectory').orElse('run')

minecraft {
    // Standard mappings for 1.20.1
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file(gameRunDirectory.get())
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'tacticaltablet.verifyEmbeddedResources', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file(gameRunDirectory.get())
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.curios.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    compileOnly fg.deobf("maven.modrinth:modern-damage-control:${moderndamage_version}")
    compileOnly fg.deobf("maven.modrinth:cloth-config:${cloth_config_version}")
    if (providers.gradleProperty('mdcSmokeVersion').isPresent()) {
        def smokeVersion = providers.gradleProperty('mdcSmokeVersion').get()
        def smokeVersionId = smokeVersion == '1.0.32' ? 'Eigsnbil'
                : smokeVersion == '1.0.3' ? 'Jf7VZY0d' : null
        if (smokeVersionId == null) {
            throw new GradleException("Unsupported mdcSmokeVersion ${smokeVersion}; use 1.0.32 or 1.0.3")
        }
        // Project-id coordinates keep the smoke runtime independent of the exact compile-only API module.
        runtimeOnly fg.deobf("maven.modrinth:P7GACeRj:${smokeVersionId}")
        runtimeOnly fg.deobf("maven.modrinth:cloth-config:${cloth_config_version}")
        runtimeOnly fg.deobf('maven.modrinth:timeless-and-classics-zero:1.1.7')
    }
    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    runtimeOnly fg.deobf("maven.modrinth:simple-voice-chat:forge-${voicechat_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def modMetadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        voicechat_api_version  : voicechat_api_version,
        curios_version_range   : curios_version_range,
        moderndamage_version   : moderndamage_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties(modMetadataProperties)
    filesMatching('META-INF/mods.toml') {
        expand(modMetadataProperties)
    }

    doLast {
        [
                'data/lobby/dimension/lobby.json'     : '\n',
                'data/lobby/dimension_type/lobby.json': '\r\n'
        ].each { relativePath, lineEnding ->
            def output = new File(destinationDir, relativePath)
            if (output.isFile()) {
                def normalized = output.getText('UTF-8')
                        .replace('\r\n', '\n')
                        .replace('\r', '\n')
                if (lineEnding == '\r\n') {
                    normalized = normalized.replace('\n', '\r\n')
                }
                output.setText(normalized, 'UTF-8')
            }
        }
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def verifyModsToml = { File modsToml, String source ->
    if (!modsToml.isFile()) {
        throw new GradleException("${source} does not contain META-INF/mods.toml")
    }

    String content = modsToml.getText('UTF-8')
    if (content.contains('${')) {
        throw new GradleException("${source} contains unresolved mods.toml placeholders")
    }

    def modIdMatcher = content =~ /(?m)^modId\s*=\s*"([^"]+)"/
    if (!modIdMatcher.find() || modIdMatcher.group(1) != mod_id) {
        throw new GradleException("${source} modId must match gradle.properties mod_id (${mod_id})")
    }

    if (!content.contains("version=\"${mod_version}\"")) {
        throw new GradleException("${source} version must match gradle.properties mod_version (${mod_version})")
    }
}

def processedModsToml = layout.buildDirectory.file('resources/main/META-INF/mods.toml')

tasks.register('verifyProcessedModsToml') {
    dependsOn tasks.named('processResources')
    inputs.file(processedModsToml)
    doLast {
        verifyModsToml(processedModsToml.get().asFile, 'Processed resources')
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : project.version,
            "Implementation-Title"    : mod_name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors
        ])
    }
}

tasks.register('verifyJarModsToml') {
    dependsOn tasks.named('jar')
    def archiveFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archiveFile)
    doLast {
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def entry = archive.getEntry('META-INF/mods.toml')
            if (entry == null) {
                throw new GradleException('JAR does not contain META-INF/mods.toml')
            }
            def extractedModsToml = File.createTempFile('tacticaltablet-mods-', '.toml')
            try {
                extractedModsToml.bytes = archive.getInputStream(entry).bytes
                verifyModsToml(extractedModsToml, 'JAR')
            } finally {
                extractedModsToml.delete()
            }
        } finally {
            archive.close()
        }
    }
}

def runtimeAssetManifest = layout.projectDirectory.file(
        'src/test/resources/deluxewarfare-runtime-assets.tsv'
)

def readRuntimeAssetManifest = {
    runtimeAssetManifest.asFile.readLines('UTF-8')
            .drop(1)
            .findAll { !it.isBlank() }
            .collect { line ->
                def columns = line.split('\t', -1)
                [
                        path  : columns[0],
                        size  : columns[1] as long,
                        sha256: columns[2]
                ]
            }
}

def sha256 = { byte[] bytes ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(bytes)
            .encodeHex()
            .toString()
}

def runtimeAssetSourcePath = { String logicalPath ->
    logicalPath.startsWith('tacticaltablet/')
            ? "src/main/resources/assets/${logicalPath}"
            : "src/main/resources/resourcepacks/tacticaltablet_overrides/assets/${logicalPath}"
}

def runtimeAssetJarPath = { String logicalPath ->
    logicalPath.startsWith('tacticaltablet/')
            ? "assets/${logicalPath}"
            : "resourcepacks/tacticaltablet_overrides/assets/${logicalPath}"
}

tasks.register('verifyEmbeddedClientResourceSources') {
    inputs.file(runtimeAssetManifest)
    inputs.dir(layout.projectDirectory.dir('src/main/resources/assets'))
    inputs.dir(layout.projectDirectory.dir(
            'src/main/resources/resourcepacks/tacticaltablet_overrides'
    ))
    doLast {
        readRuntimeAssetManifest().each { expected ->
            File source = layout.projectDirectory.file(
                    runtimeAssetSourcePath(expected.path)
            ).asFile
            if (!source.isFile()) {
                throw new GradleException("Missing embedded client resource: ${expected.path}")
            }
            if (source.length() != expected.size) {
                throw new GradleException("Unexpected size for embedded client resource: ${expected.path}")
            }
            if (sha256(source.bytes) != expected.sha256) {
                throw new GradleException("Unexpected SHA-256 for embedded client resource: ${expected.path}")
            }
        }

        File resources = layout.projectDirectory.dir('src/main/resources').asFile
        def forbidden = fileTree(resources) {
            include '**/*.zip'
            include '**/pack.png'
            include '**/README_RU.txt'
            include '**/EDITING_GUIDE_RU.md'
            include '**/SOURCE_SNAPSHOT.txt'
            include '**/UPDATE_NOTES*'
            include '**/TEMPLATES/**'
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "External resource-pack files leaked into runtime resources: ${forbidden}"
            )
        }
    }
}

tasks.register('verifyJarEmbeddedClientResources') {
    dependsOn tasks.named('jar')
    inputs.file(runtimeAssetManifest)
    def archiveFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archiveFile)
    doLast {
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            readRuntimeAssetManifest().each { expected ->
                String path = runtimeAssetJarPath(expected.path)
                def entry = archive.getEntry(path)
                if (entry == null) {
                    throw new GradleException("JAR is missing embedded client resource: ${path}")
                }
                byte[] bytes = archive.getInputStream(entry).bytes
                if (bytes.length != expected.size || sha256(bytes) != expected.sha256) {
                    throw new GradleException("JAR resource differs from source manifest: ${path}")
                }
            }

            [
                    'META-INF/licenses/Curios-LGPL-3.0-or-later.txt',
                    'THIRD_PARTY_NOTICES.txt',
                    'resourcepacks/tacticaltablet_overrides/pack.mcmeta'
            ].each { required ->
                if (archive.getEntry(required) == null) {
                    throw new GradleException("JAR is missing third-party notice: ${required}")
                }
            }

            [
                    'resourcepacks/tacticaltablet_overrides/assets/minecraft/font/default.json',
                    'resourcepacks/tacticaltablet_overrides/assets/deluxewarfare/font/jetbrains_mono_medium.ttf',
                    'META-INF/licenses/JetBrains-Mono-Apache-2.0.txt'
            ].each { removed ->
                if (archive.getEntry(removed) != null) {
                    throw new GradleException("JAR contains removed custom font resource: ${removed}")
                }
            }

            def forbidden = archive.entries().findAll { entry ->
                String path = entry.name
                path.endsWith('.zip')
                        || path == 'pack.png'
                        || path == 'README_RU.txt'
                        || path == 'EDITING_GUIDE_RU.md'
                        || path == 'SOURCE_SNAPSHOT.txt'
                        || path.startsWith('UPDATE_NOTES')
                        || path.startsWith('TEMPLATES/')
            }.collect { it.name }
            if (!forbidden.isEmpty()) {
                throw new GradleException(
                        "External resource-pack files leaked into JAR: ${forbidden}"
                )
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register('verifyJarEmbeddedServerData') {
    dependsOn tasks.named('jar')
    def archiveFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(archiveFile)
    doLast {
        def expected = [
                'data/lobby/dimension/lobby.json'     : 'f20b614fc6cac9923215b3891e8932f90035a3c2dae479a147b1008c7494ad89',
                'data/lobby/dimension_type/lobby.json': 'd1f4abba76943bcd681a9fdb1c0e558a75e4f91306586bf628967e51cb9240a5',
                'data/lobby/structures/spawn.nbt'      : '75ed60c6143ef7ebf5fad70d5e942a09177002b4014f4b6a55c38ddcf506c61e'
        ]
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            expected.each { path, expectedSha256 ->
                def entry = archive.getEntry(path)
                if (entry == null) {
                    throw new GradleException("JAR is missing embedded server-data resource: ${path}")
                }
                byte[] bytes = archive.getInputStream(entry).bytes
                if (sha256(bytes) != expectedSha256) {
                    throw new GradleException("JAR server-data resource differs from approved embedded source: ${path}")
                }
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register('verifyModernDamageRussianLocalization') {
    inputs.file(layout.projectDirectory.file(
            'src/main/resources/resourcepacks/tacticaltablet_overrides/assets/moderndamage/lang/ru_ru.json'))
    doLast {
        def reference = configurations.detachedConfiguration(
                dependencies.create("maven.modrinth:modern-damage-control:${moderndamage_version}"))
                .singleFile
        def archive = new java.util.zip.ZipFile(reference)
        try {
            def entry = archive.getEntry('assets/moderndamage/lang/en_us.json')
            if (entry == null) throw new GradleException("MDC ${moderndamage_version} has no en_us.json")
            String english = archive.getInputStream(entry).getText('UTF-8')
            String russian = layout.projectDirectory.file(
                    'src/main/resources/resourcepacks/tacticaltablet_overrides/assets/moderndamage/lang/ru_ru.json')
                    .asFile.getText('UTF-8')
            new groovy.json.JsonSlurper().parseText(english)
            new groovy.json.JsonSlurper().parseText(russian)
            def keyPattern = ~/(?m)^\s*"([^"]+)"\s*:/
            def englishKeys = (english =~ keyPattern).collect { it[1] }
            def russianKeys = (russian =~ keyPattern).collect { it[1] }
            if (englishKeys.size() != englishKeys.toSet().size()) {
                throw new GradleException("MDC ${moderndamage_version} en_us.json contains duplicate keys")
            }
            if (russianKeys.size() != russianKeys.toSet().size()) {
                throw new GradleException('TacticalTablet MDC ru_ru.json contains duplicate keys')
            }
            def missing = englishKeys.toSet() - russianKeys.toSet()
            def extra = russianKeys.toSet() - englishKeys.toSet()
            if (!missing.isEmpty() || !extra.isEmpty()) {
                throw new GradleException("MDC ${moderndamage_version} localization mismatch; missing=${missing}, extra=${extra}")
            }
            if (englishKeys.size() != 180) {
                throw new GradleException("Expected 180 MDC ${moderndamage_version} keys, got ${englishKeys.size()}")
            }
        } finally {
            archive.close()
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyProcessedModsToml')
    dependsOn tasks.named('verifyJarModsToml')
    dependsOn tasks.named('verifyEmbeddedClientResourceSources')
    dependsOn tasks.named('verifyJarEmbeddedClientResources')
    dependsOn tasks.named('verifyJarEmbeddedServerData')
    dependsOn tasks.named('verifyModernDamageRussianLocalization')
}
