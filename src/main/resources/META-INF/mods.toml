modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat_api"
    mandatory=true
    versionRange="[${voicechat_api_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"

# Runtime compatibility is checked by the isolated adapter. Keep this range broad so an
# unsupported optional MDC build cannot prevent TacticalTablet itself from starting.
[[dependencies.${mod_id}]]
    modId="moderndamage"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
